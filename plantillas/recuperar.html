<!doctype html>
<html lang="es">
<body style="margin:0;padding:0;background:#f0f2f5;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f0f2f5;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:14px;padding:32px 28px;">
        <tr><td style="font-size:26px;font-weight:900;color:#1976D2;padding-bottom:18px;">Brexel</td></tr>
        <tr><td style="font-size:20px;font-weight:700;color:#1a1a1a;padding-bottom:12px;">Recuperá tu contraseña</td></tr>
        <tr><td style="font-size:15px;line-height:22px;color:#444444;padding-bottom:24px;">
          Recibimos un pedido para cambiar la contraseña de tu cuenta. Tocá el botón para elegir una nueva.
        </td></tr>
        <tr><td style="padding-bottom:24px;">
          <a href="{{ .SiteURL }}/?token_hash={{ .TokenHash }}&type=recovery"
             style="display:inline-block;background:#1976D2;color:#ffffff;text-decoration:none;font-weight:700;font-size:16px;padding:14px 28px;border-radius:12px;">
            Cambiar mi contraseña
          </a>
        </td></tr>
        <tr><td style="font-size:13px;line-height:20px;color:#777777;">
          Si no pediste este cambio, ignorá este correo: tu contraseña actual sigue funcionando.<br>
          El link vence en poco tiempo y sirve una sola vez.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
